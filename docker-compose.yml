services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin_dashboard
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy

  data-service:
    build:
      context: ./src/data-service
    container_name: data-service
    restart: always
    env_file:
      - ./src/data-service/.env
    expose:
      - "8001"

  backend:
    build:
      context: ./src/backend
    container_name: backend
    restart: always
    env_file:
      - ./src/backend/.env
    environment:
      POSTGRES_HOST: postgres
      DATA_SERVICE_BASE_URL: http://data-service:8001
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      data-service:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: k6
    profiles: ["load-test"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      K6_BASE_URL: http://backend:8000
    volumes:
      - ./src/backend/load-tests:/scripts:ro
    working_dir: /scripts
    command: ["run", "main.js"]

volumes:
  postgres_data: