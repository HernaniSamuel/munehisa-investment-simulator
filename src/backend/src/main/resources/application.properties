spring.application.name=backend
spring.profiles.active=dev

# The ASCII art banner prints straight to stdout on every startup, independent of the
# Logback config in logback-spring.xml - left on, it's a non-JSON line on every container
# start, in production as much as locally.
spring.main.banner-mode=off

# Off by default in any environment that doesn't explicitly opt in (e.g. production).
# Local dev sets SWAGGER_UI_ENABLED=true in .env.
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:false}

# GET /actuator/health is what container/orchestrator health checks call - it should
# reflect whether the app can serve requests (DB connectivity), not an unrelated SMTP
# relay's availability. Without this, actuator auto-detects a MailHealthIndicator from
# spring-boot-starter-mail that drags the whole aggregated status to DOWN whenever the
# mail server is unreachable, which isn't what "the app and its DB connection are
# healthy" should mean.
management.health.mail.enabled=false

# secret key for JWT token
api.security.token.secret=${JWT_SECRET}
# server url configurations
server.port=8000
app.base-url=http://localhost:${server.port}
# email that will send the emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=simuladordeinvestimentos@gmail.com
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# token spiry time
jwt.expiration=${JWT_EXPIRATION:3600000}
verification.token.expiration=${VERIFICATION_TOKEN_EXPIRATION:1800000}
reset.token.expiration=${RESET_TOKEN_EXPIRATION:900000}
# database settings
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# JPA / Hibernate
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
login.lockout.max-attempts=${MAX_ATTEMPTS:5}
login.lockout.lock-time=${LOCK_TIME:900000}
# in-memory throttle for POST /auth/login attempts against emails with no
# matching account (issue #26) - keeps the 401/429 transition indistinguishable
# from the account-lockout one above, without needing a User row to track it
login.unknown-email-throttle.max-attempts=${UNKNOWN_EMAIL_THROTTLE_MAX_ATTEMPTS:5}
login.unknown-email-throttle.window=${UNKNOWN_EMAIL_THROTTLE_WINDOW:900000}
login.unknown-email-throttle.max-tracked-emails=${UNKNOWN_EMAIL_THROTTLE_MAX_TRACKED_EMAILS:10000}
# Data-service integration (Python inflation data-service)
data-service.base-url=${DATA_SERVICE_BASE_URL:http://127.0.0.1:8001}
data-service.api-key=${DATA_SERVICE_API_KEY}
# Day of month (1-31) from which a missing current-month inflation row triggers a lazy re-fetch
inflation.refresh.threshold-day=${INFLATION_REFRESH_THRESHOLD_DAY:20}
