spring.application.name=backend
spring.profiles.active=dev

# Off by default in any environment that doesn't explicitly opt in (e.g. production).
# Local dev sets SWAGGER_UI_ENABLED=true in .env.
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_UI_ENABLED:false}

# GET /actuator/health is what container/orchestrator health checks call - it should
# reflect whether the app can serve requests (DB connectivity), not an unrelated SMTP
# relay's availability. Without this, actuator auto-detects a MailHealthIndicator from
# spring-boot-starter-mail that drags the whole aggregated status to DOWN whenever the
# mail server is unreachable, which isn't what "the app and its DB connection are
# healthy" should mean.
management.health.mail.enabled=false
