# frontend URL - verification/password-reset emails link here, not to the API itself.
# No default here (unlike dev): starting in prod without FRONTEND_URL set should fail
# fast instead of silently emailing localhost links.
app.frontend-url=${FRONTEND_URL}
# cors allowed URL - defaults to the GitHub Pages frontend, overridable without a code
# change if the production frontend origin ever changes.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hernanisamuel.github.io}

# Actuator: only /actuator/health should be reachable in prod - /env, /beans, etc. leak
# internal configuration and are meant for local/dev inspection only.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
