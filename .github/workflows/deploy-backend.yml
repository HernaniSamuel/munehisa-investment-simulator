name: Deploy backend to Hetzner

on:
  push:
    branches: [main]
    paths:
      - 'src/backend/**'
      - 'src/data-service/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/hernanisamuel/munehisa-investment-simulator-backend
  DATA_SERVICE_IMAGE: ghcr.io/hernanisamuel/munehisa-investment-simulator-data-service

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B test -DexcludedGroups=integration

  data-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: src/data-service/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

  build-and-push:
    needs: [backend-test, data-service-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: src/data-service
          push: true
          tags: |
            ${{ env.DATA_SERVICE_IMAGE }}:latest
            ${{ env.DATA_SERVICE_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_VM_HOST }}
          username: ${{ secrets.HETZNER_VM_SSH_USER }}
          key: ${{ secrets.HETZNER_VM_SSH_KEY }}
          # The deploy key's authorized_keys entry forces this exact command server-side
          # regardless of what's sent here - kept identical for clarity when reading logs.
          # git pull keeps deploy/docker-compose.prod.yml and Caddyfile in sync too, not just
          # the images - without it, a compose-file-only change never reaches the VM.
          script: cd /root/app && git pull && cd deploy && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
